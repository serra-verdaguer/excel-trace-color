name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - name: Manifest is well-formed XML
        run: python3 -c "import xml.dom.minidom; xml.dom.minidom.parse('manifest.xml')"
