<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Trace &amp; Color</title>
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  <link rel="stylesheet" href="taskpane.css" />
</head>
<body>
  <!-- Mode -->
  <header class="top">
    <div class="seg" role="tablist">
      <button role="tab" data-dir="precedents" class="on" title="Cells your cell uses">Precedents</button>
      <button role="tab" data-dir="dependents" title="Cells that use your cell">Dependents</button>
    </div>
    <button id="exitBtn" class="ghost" title="Back to your cell and close (Esc)">✕</button>
  </header>

  <!-- Your cell: always visible, the "home" of the tree -->
  <section class="home" id="home" title="Your cell (Home key)">
    <div class="home-label">YOUR CELL</div>
    <div class="home-row">
      <span class="home-addr" id="homeAddr">Select a cell</span>
      <span class="home-val" id="homeVal"></span>
    </div>
    <div id="homeFx"></div>
  </section>

  <!-- Tree of precedents / dependents (only visible rows are drawn) -->
  <main id="tree" tabindex="0" aria-label="References">
    <div id="spacer"></div>
    <div id="rows"></div>
    <div class="empty" id="empty">Select a cell, then press <b>Precedents</b> on the ribbon.</div>
  </main>

  <!-- What the highlighted row is -->
  <section class="detail" id="detail">
    <div class="path" id="path"></div>
    <div class="d-row">
      <span class="d-addr" id="dAddr"></span>
      <span class="d-val" id="dVal"></span>
    </div>
    <div id="dFx"></div>
    <div id="dNotes"></div>
  </section>

  <footer class="keys">
    <span><kbd>↑</kbd><kbd>↓</kbd> move</span>
    <span><kbd>→</kbd> open</span>
    <span><kbd>←</kbd> step back</span>
    <span><kbd>Home</kbd> your cell</span>
    <span><kbd>Esc</kbd> exit</span>
    <span>From the sheet: hold <kbd>Ctrl</kbd><kbd>Alt</kbd> + arrows</span>
  </footer>

  <details class="color">
    <summary>Color code settings</summary>
    <div class="color-head">
      <button id="colorBtn" class="primary" title="Selection if more than one cell is selected, otherwise the whole sheet">Color sheet / selection</button>
      <button id="colorWbBtn">Whole workbook</button>
    </div>
    <div class="legend">
      <label><input type="color" data-color="input" /> Inputs (hard-codes)</label>
      <label><input type="color" data-color="formula" /> Formulas</label>
      <label><input type="color" data-color="link" /> Links to other sheets</label>
      <label><input type="color" data-color="external" /> Links to other files</label>
      <label><input type="checkbox" id="fillInputs" /><input type="color" data-color="inputFill" /> Input background
        <button id="matchFill" class="link small" title="Use the background of the selected cell as the input background">match selected cell</button></label>
      <button id="resetColors" class="link small">Reset colors</button>
    </div>
  </details>

  <footer id="status" class="status"></footer>

  <script src="lib/core.js"></script>
  <script src="lib/colorcode.js"></script>
  <script src="lib/trace.js"></script>
  <script src="app.js"></script>
</body>
</html>
