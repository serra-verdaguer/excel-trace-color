<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Trace &amp; Color</title>
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  <link rel="stylesheet" href="taskpane.css" />
</head>
<body>
  <!-- The cell being traced -->
  <section class="origin" id="origin">
    <nav class="crumbs" id="crumbs" aria-label="Trace path"></nav>
    <div class="origin-row">
      <button class="origin-addr" id="originBtn" title="Go back to this cell (Esc)">
        <span class="o-sheet" id="oSheet">Select a cell</span><span class="o-cell" id="oCell"></span>
      </button>
      <span class="o-value" id="oValue"></span>
    </div>
    <code class="o-formula" id="oFormula"></code>
  </section>

  <!-- Direction -->
  <nav class="tabs" role="tablist">
    <button role="tab" data-dir="precedents" class="on" title="Cells this cell uses">← Precedents <span class="n" id="nPrec"></span></button>
    <button role="tab" data-dir="dependents" title="Cells that use this cell">Dependents → <span class="n" id="nDep"></span></button>
  </nav>
  <div class="opts">
    <label title="Show every level, not just the cells referenced directly"><input type="checkbox" id="allLevels" /> All levels</label>
    <label title="Trace automatically whenever you click another cell"><input type="checkbox" id="autoTrace" checked /> Follow selection</label>
    <input id="filter" type="search" placeholder="Filter…" hidden />
  </div>

  <!-- Results, grouped by sheet -->
  <main id="results" tabindex="0" aria-live="polite">
    <div class="empty">
      <p><b>Click any cell</b> in your model.</p>
      <p>Its precedents appear here, grouped by sheet.</p>
    </div>
  </main>
  <footer class="keys" id="keys">
    <span><kbd>↑</kbd><kbd>↓</kbd> move</span>
    <span><kbd>→</kbd> trace into</span>
    <span><kbd>←</kbd> back</span>
    <span><kbd>Esc</kbd> start cell</span>
  </footer>

  <!-- Color coding (tucked away) -->
  <details class="color">
    <summary>Color code</summary>
    <div class="color-head">
      <button id="colorBtn" class="primary" title="Selection if more than one cell is selected, otherwise the whole sheet">Color sheet / selection</button>
      <button id="colorWbBtn">Whole workbook</button>
    </div>
    <div class="legend">
      <label><input type="color" data-color="input" /> Inputs (hard-codes)</label>
      <label><input type="color" data-color="formula" /> Formulas</label>
      <label><input type="color" data-color="link" /> Links to other sheets</label>
      <label><input type="color" data-color="external" /> Links to other files</label>
      <label><input type="checkbox" id="fillInputs" /><input type="color" data-color="inputFill" /> Input background
        <button id="matchFill" class="link small" title="Use the background of the selected cell as the input background">match selected cell</button></label>
      <button id="resetColors" class="link small">Reset colors</button>
    </div>
  </details>

  <footer id="status" class="status muted">Loading…</footer>

  <script src="lib/core.js"></script>
  <script src="lib/colorcode.js"></script>
  <script src="lib/trace.js"></script>
  <script src="app.js"></script>
</body>
</html>
