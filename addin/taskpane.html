<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Trace &amp; Color</title>
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  <link rel="stylesheet" href="taskpane.css" />
</head>
<body>
  <header class="bar">
    <div class="origin">
      <span class="muted">Cell</span>
      <button id="originBtn" class="link" title="Go back to the traced cell">—</button>
    </div>
    <label class="toggle" title="Re-trace automatically whenever you select another cell">
      <input type="checkbox" id="autoTrace" /> Auto
    </label>
  </header>

  <section class="actions">
    <div class="seg" role="group" aria-label="Direction">
      <button data-dir="precedents" class="on">Precedents</button>
      <button data-dir="dependents">Dependents</button>
    </div>
    <div class="seg" role="group" aria-label="Depth">
      <button data-depth="direct" class="on">Direct</button>
      <button data-depth="all">All levels</button>
    </div>
    <button id="traceBtn" class="primary">Trace</button>
  </section>

  <section class="filterbar">
    <input id="filter" type="search" placeholder="Filter by sheet, address, value or formula…" />
    <span id="summary" class="muted"></span>
  </section>

  <main id="results" aria-live="polite">
    <p class="empty">Select a cell and press <b>Trace</b> (or use the ribbon buttons).<br />Click any result to jump to it. ▸ drills one level further.</p>
  </main>

  <section class="color">
    <div class="color-head">
      <h2>Color code</h2>
      <button id="colorBtn" class="primary" title="Selection if more than one cell is selected, otherwise the whole sheet">Color sheet / selection</button>
      <button id="colorWbBtn">Whole workbook</button>
    </div>
    <div class="legend">
      <label><input type="color" data-color="input" /> Inputs (hard-codes)</label>
      <label><input type="color" data-color="formula" /> Formulas</label>
      <label><input type="color" data-color="link" /> Links to other sheets</label>
      <label><input type="color" data-color="external" /> Links to other files</label>
      <button id="resetColors" class="link small">Reset colors</button>
    </div>
  </section>

  <footer id="status" class="status muted">Loading…</footer>

  <script src="lib/core.js"></script>
  <script src="lib/colorcode.js"></script>
  <script src="lib/trace.js"></script>
  <script src="app.js"></script>
</body>
</html>
